<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>排一周训练计划 · 多步工具调用</title>
<style>
  /* 配色跟 index.html 同一套：浅色为主，暗色跟随系统。
     这个页面要证明的不是「AI 会写计划」，是「AI 排的计划能一条条查回来」，
     所以 trace 和 ref 是主要内容，不是装饰。 */
  :root{
    --bg:#ffffff;--bg-soft:#f9f9fa;--panel:#f5f5f7;--panel-2:#fafafa;
    --line:#ebebee;--line-2:#dedee3;--text:#1b1b1f;--text-2:#3f3f46;
    --muted:#8e8e97;--accent:#4d6bfe;--accent-soft:#eef1ff;--accent-line:#d6dcff;
    --ok:#127c47;--ok-soft:#eefaf3;--warn:#9a6b16;--warn-soft:#fdf7e8;
    --danger:#d13b3b;--danger-soft:#fdf2f2;
    --shadow:0 2px 10px rgba(16,18,26,.05);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;--r:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#191a1c;--bg-soft:#141517;--panel:#242529;--panel-2:#1f2023;
      --line:#2c2d31;--line-2:#3a3b40;--text:#ececef;--text-2:#c3c4ca;
      --muted:#8b8c94;--accent:#7b90ff;--accent-soft:#232840;--accent-line:#333c5e;
      --ok:#4fc07f;--ok-soft:#1b2a22;--warn:#d8a545;--warn-soft:#2a2418;
      --danger:#f0736f;--danger-soft:#2b1d1e;--shadow:0 2px 10px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:32px 20px 80px}
  header{margin-bottom:22px}
  h1{font-size:21px;font-weight:650;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13.5px;margin-top:6px;line-height:1.65}
  .sub code{font-family:var(--mono);font-size:12.5px;background:var(--panel);padding:1px 5px;border-radius:5px}

  form{background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:640px){.grid{grid-template-columns:1fr 1fr}}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  select,input[type=text],input[type=number],input[type=password]{
    width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:9px;
    padding:8px 10px;font:inherit;font-size:14px;color:var(--text);outline:none;
  }
  select:focus,input:focus{border-color:var(--accent)}
  .inj{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:37px}
  .inj button{
    background:var(--bg);border:1px solid var(--line-2);color:var(--text-2);
    border-radius:8px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer;
  }
  .inj button.on{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
  .foot{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .go{
    background:var(--accent);color:#fff;border:none;border-radius:10px;
    padding:9px 20px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;
  }
  .go:disabled{opacity:.55;cursor:default}
  .note{font-size:12.5px;color:var(--muted)}
  .code-in{max-width:170px}

  .status{margin:20px 0 0;display:none}
  .status.on{display:block}
  .bar{height:3px;background:var(--panel);border-radius:3px;overflow:hidden;margin-bottom:8px}
  .bar i{display:block;height:100%;width:30%;background:var(--accent);border-radius:3px;animation:run 1.4s ease-in-out infinite}
  @keyframes run{0%{margin-left:-30%}100%{margin-left:100%}}
  .steps{font-size:13px;color:var(--text-2);font-family:var(--mono)}
  .steps span{color:var(--muted)}

  .result{display:none}
  .result.on{display:block}
  .banner{border-radius:var(--r);padding:13px 16px;margin:20px 0 16px;font-size:14px;border:1px solid}
  .banner.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .banner.bad{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
  .banner.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
  .banner b{display:block;margin-bottom:3px}
  .banner ul{margin:6px 0 0 18px;font-size:13px;line-height:1.7}

  .metrics{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .m{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:12.5px;color:var(--text-2)}
  .m b{font-family:var(--mono);font-size:13.5px;color:var(--text);margin-right:4px}

  .summary{font-size:14.5px;color:var(--text-2);line-height:1.8;background:var(--accent-soft);
    border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:12px 16px;margin-bottom:20px}

  .day{border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden;background:var(--bg)}
  .day-h{display:flex;align-items:baseline;gap:10px;padding:12px 16px;background:var(--panel-2);border-bottom:1px solid var(--line)}
  .day-n{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .day-f{font-weight:650;font-size:15px}
  .day-t{margin-left:auto;font-size:12.5px;color:var(--muted)}
  table{width:100%;border-collapse:collapse}
  td{padding:10px 16px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:top}
  tr:last-child td{border-bottom:none}
  .ex-n{font-weight:600}
  .ex-p{color:var(--muted);font-size:12px;margin-left:6px}
  .sets{font-family:var(--mono);font-size:12.5px;color:var(--text-2);white-space:nowrap}
  .ref{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--panel);
    border-radius:5px;padding:1px 6px;white-space:nowrap}
  .cue{color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.6}

  h2{font-size:14px;font-weight:650;margin:28px 0 10px;display:flex;align-items:center;gap:8px}
  h2 .hint{font-weight:400;color:var(--muted);font-size:12.5px}
  .trace{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:12.5px}
  .tr{display:grid;grid-template-columns:46px 1fr;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
  .tr:last-child{border-bottom:none}
  .tr.bad{background:var(--danger-soft)}
  .tr .k{font-family:var(--mono);color:var(--muted);font-size:11.5px;padding-top:2px}
  .tr .tool{font-family:var(--mono);color:var(--accent);font-size:12px}
  .tr .args{font-family:var(--mono);color:var(--muted);font-size:11.5px;word-break:break-all}
  .tr .res{color:var(--text-2);margin-top:2px}

  .empty{color:var(--muted);font-size:13px;padding:14px 0}
  footer{margin-top:36px;font-size:12.5px;color:var(--muted);line-height:1.9;border-top:1px solid var(--line);padding-top:16px}
  footer code{font-family:var(--mono);font-size:12px;background:var(--panel);padding:1px 5px;border-radius:5px}
  a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>排一周训练计划</h1>
    <p class="sub">
      模型先调 <code>search_exercises</code> 查真实动作库，再组计划，最后调 <code>check_plan</code> 自查。
      组次和间歇由服务端从库里填 —— 计划里每个数字都能追溯到一条已发布的正文。
    </p>
  </header>

  <form id="f">
    <div class="grid">
      <div><label>目标</label>
        <select id="goal"><option>增肌</option><option>减脂</option><option>力量</option><option>新手适应</option></select>
      </div>
      <div><label>每周几天</label>
        <select id="days"><option>2</option><option selected>3</option><option>4</option><option>5</option></select>
      </div>
      <div><label>每次多久（分钟）</label>
        <input type="number" id="session" value="60" min="20" max="180" step="5">
      </div>
      <div><label>器械条件</label>
        <select id="equip"><option>健身房</option><option>哑铃</option><option>自重</option><option>只有器械</option></select>
      </div>
      <div><label>水平</label>
        <select id="level"><option>新手</option><option>有基础</option><option>进阶</option></select>
      </div>
      <div><label>伤病（可不选）</label>
        <div class="inj" id="inj">
          <button type="button" data-v="膝盖">膝盖</button>
          <button type="button" data-v="腰">腰</button>
          <button type="button" data-v="肩">肩</button>
        </div>
      </div>
    </div>
    <div class="foot">
      <input type="text" id="note" placeholder="补充：比如想保留肌肉 / 时间很紧 / 只有一对可调哑铃" style="flex:1;min-width:200px">
      <button class="go" id="go" type="submit">排计划</button>
      <input type="password" id="code" class="code-in" placeholder="访问口令">
      <span class="note" id="hint">一次要查 5~8 次动作库，等 20~40 秒</span>
    </div>
  </form>

  <div class="status" id="st">
    <div class="bar"><i></i></div>
    <div class="steps"><span id="phase">正在查动作库…</span> <span id="sec">0.0s</span></div>
  </div>

  <div class="result" id="res"></div>

  <footer>
    动作库 <span id="libinfo">33 个动作</span>，每个都带 <code>ref</code> 指回知识库正文。<br>
    计划里出现库里没有的动作会被剔除并标红，不会静默混进去。
  </footer>
</div>

<script>
const $ = s => document.querySelector(s);
const codeEl = $('#code'), noteEl = $('#note');
codeEl.value = localStorage.getItem('plan_code') || '';
noteEl.value = localStorage.getItem('plan_note') || '';
let injuries = [];

document.querySelectorAll('#inj button').forEach(b => {
  b.onclick = () => {
    const v = b.dataset.v;
    if (injuries.includes(v)) { injuries = injuries.filter(x => x !== v); b.classList.remove('on'); }
    else { injuries.push(v); b.classList.add('on'); }
  };
});

let timer = null, t0 = 0;
const PHASES = ['正在查动作库…', '正在组计划…', '正在自查动作和伤病…', '快好了，在排版…'];
function startTimer(){
  t0 = Date.now();
  $('#st').classList.add('on');
  let i = 0;
  timer = setInterval(() => {
    const s = (Date.now() - t0) / 1000;
    $('#sec').textContent = s.toFixed(1) + 's';
    const p = Math.min(PHASES.length - 1, Math.floor(s / 9));
    if (p !== i) { i = p; $('#phase').textContent = PHASES[p]; }
  }, 100);
}
function stopTimer(){ clearInterval(timer); $('#st').classList.remove('on'); }

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(d){
  const bad = d.needs_review;
  const errs = (d.audit && d.audit.errors) || [];
  const warns = (d.audit && d.audit.warnings) || [];
  let h = '';

  if (bad) {
    h += `<div class="banner bad"><b>这份计划需要再看一眼</b>
      ${errs.length ? '<ul>' + errs.map(e => `<li>${esc(e.detail || e.type)}</li>`).join('') + '</ul>' : ''}
      <div style="margin-top:6px;font-size:12.5px;opacity:.85">没排好的结果不会进缓存，也不会被当成标准答案。</div></div>`;
  } else if (warns.length) {
    h += `<div class="banner warn"><b>排出来了，有 ${warns.length} 条提醒</b>
      <ul>${warns.map(w => `<li>${esc(w.detail || w.type)}</li>`).join('')}</ul></div>`;
  } else {
    h += `<div class="banner ok"><b>排出来了，检查都过了</b>动作都在库里、没有伤病冲突、天数对得上。</div>`;
  }

  const nEx = d.plan.reduce((a, x) => a + x.exercises.length, 0);
  const est = Object.values((d.audit && d.audit.est_minutes) || {});
  h += `<div class="metrics">
    <div class="m"><b>${d.plan.length}</b>天 · <b>${nEx}</b>个动作</div>
    <div class="m"><b>${d.trace.length}</b>次工具调用 · <b>${d.steps}</b>步</div>
    <div class="m"><b>${(d.timings ? d.timings.total_ms / 1000 : 0).toFixed(1)}</b>秒</div>
    <div class="m"><b>${d.tokens}</b>token</div>
    ${est.length ? `<div class="m">估算时长 <b>${est.join('/')}</b>分钟（预算 ${d.profile.session_min}）</div>` : ''}
    ${d.cached ? '<div class="m">来自缓存</div>' : ''}
  </div>`;

  if (d.summary) h += `<div class="summary">${esc(d.summary)}</div>`;

  d.plan.forEach(day => {
    const est1 = (d.audit.est_minutes || {})[day.day];
    h += `<div class="day"><div class="day-h">
      <span class="day-n">D${day.day}</span><span class="day-f">${esc(day.focus)}</span>
      ${est1 ? `<span class="day-t">约 ${est1} 分钟</span>` : ''}</div><table>`;
    day.exercises.forEach(e => {
      h += `<tr>
        <td style="width:46%"><div><span class="ex-n">${esc(e.name)}</span><span class="ex-p">${esc(e.part)}·${esc(e.sub || '')}</span></div>
          ${e.cue ? `<div class="cue">${esc(e.cue)}</div>` : ''}</td>
        <td class="sets">${esc(e.sets)} × ${esc(e.reps)}<div style="color:var(--muted);font-size:11.5px">间歇 ${e.rest}s</div></td>
        <td style="width:70px;text-align:right"><span class="ref" title="来自知识库正文">${esc(e.ref)}</span></td>
      </tr>`;
    });
    h += '</table></div>';
  });

  h += `<h2>它查了什么 <span class="hint">每一步的参数和结果，可追溯</span></h2><div class="trace">`;
  if (!d.trace.length) h += '<div class="tr"><div class="k">—</div><div>没有工具调用记录</div></div>';
  d.trace.forEach(t => {
    h += `<div class="tr ${t.ok ? '' : 'bad'}">
      <div class="k">S${t.step}</div>
      <div><span class="tool">${esc(t.tool)}</span>
        <span class="args">${esc(JSON.stringify(t.args)).slice(0, 160)}</span>
        <div class="res">→ ${esc(t.brief)} <span style="color:var(--muted)">${t.ms}ms</span></div></div>
    </div>`;
  });
  h += '</div>';

  if (d.dropped && d.dropped.length) {
    h += `<h2>被剔除的动作 <span class="hint">模型写了但库里没有</span></h2>
      <div class="trace">${d.dropped.map(x => `<div class="tr bad"><div class="k">D${x.day}</div>
        <div class="res">${esc(x.name)} —— 库里没有这个动作，已剔除</div></div>`).join('')}</div>`;
  }

  $('#res').innerHTML = h;
  $('#res').classList.add('on');
}

$('#f').onsubmit = async ev => {
  ev.preventDefault();
  const body = {
    goal: $('#goal').value,
    days: +$('#days').value,
    session_min: +$('#session').value,
    equipment: $('#equip').value,
    level: $('#level').value,
    injuries: injuries,
    note: noteEl.value.trim(),
  };
  localStorage.setItem('plan_code', codeEl.value);
  localStorage.setItem('plan_note', noteEl.value);
  $('#go').disabled = true;
  $('#res').classList.remove('on');
  startTimer();
  try {
    const r = await fetch('/plan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-access-code': codeEl.value },
      body: JSON.stringify(body),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || ('HTTP ' + r.status));
    render(d);
  } catch (e) {
    $('#res').innerHTML = `<div class="banner bad"><b>没排出来</b>${esc(e.message)}</div>`;
    $('#res').classList.add('on');
  } finally {
    stopTimer();
    $('#go').disabled = false;
  }
};

fetch('/meta').then(r => r.json()).then(m => {
  const n = m.exercises || m.plan_exercises;
  if (n) $('#libinfo').textContent = n + ' 个动作';
}).catch(() => {});
</script>
</body>
</html>
