<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>健身知识库问答</title>
<style>
  :root{
    --bg:#0d1014;
    --panel:#151a21;
    --panel-2:#1a202a;
    --line:#252d38;
    --line-soft:#1e252f;
    --text:#e7ebf1;
    --text-2:#b3bdcb;
    --muted:#7d8899;
    --accent:#e5484d;
    --accent-dim:#2a1518;
    --ok:#3fb950;
    --warn:#d29922;
    --radius:12px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px;margin:0 auto;padding:44px 24px 80px}

  /* ---- 页头 ---- */
  header{margin-bottom:28px}
  .kicker{
    display:inline-flex;align-items:center;gap:7px;
    font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:10px;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);transition:background .3s}
  .dot.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(63,185,80,.12)}
  .dot.err{background:var(--accent)}
  h1{font-size:26px;font-weight:650;letter-spacing:-.01em;line-height:1.35}
  h1 span{color:var(--accent)}
  .sub{margin-top:8px;color:var(--muted);font-size:13.5px}
  .sub b{color:var(--text-2);font-weight:500}

  /* ---- 提问区 ---- */
  .ask{
    background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:16px;margin-top:22px;
    transition:border-color .2s;
  }
  .ask:focus-within{border-color:#39424f}
  textarea{
    width:100%;background:transparent;border:0;outline:0;resize:none;
    color:var(--text);font:inherit;line-height:1.6;
    min-height:52px;max-height:180px;
  }
  textarea::placeholder{color:#5d6777}
  .row{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
  /* 口令行：只在服务端配了 ACCESS_CODE 时出现，本地跑永远看不到 */
  .code-row{display:none;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
  .code-row.on{display:flex}
  .code-row input{
    flex:1;min-width:180px;background:var(--bg-2);border:1px solid var(--line);
    border-radius:8px;padding:8px 11px;color:var(--text);font-size:13.5px;outline:none;
  }
  .code-row input:focus{border-color:#39424f}
  .code-row .hint{font-size:12.5px;color:var(--muted)}
  .code-row button{
    background:var(--bg-2);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit;
  }
  .code-row button:hover{border-color:#414b59;color:#fff}
  .spacer{flex:1}
  .ctl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
  select{
    background:var(--panel-2);color:var(--text-2);border:1px solid var(--line);
    border-radius:7px;padding:4px 8px;font-size:12.5px;outline:0;cursor:pointer;
  }
  .switch{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
  .switch input{accent-color:var(--accent);cursor:pointer}
  button.primary{
    background:var(--accent);color:#fff;border:0;border-radius:8px;
    padding:8px 18px;font:inherit;font-size:14px;font-weight:500;
    cursor:pointer;transition:filter .15s,opacity .15s;
  }
  button.primary:hover{filter:brightness(1.08)}
  button.primary:disabled{opacity:.45;cursor:not-allowed}
  button.ghost{
    background:transparent;color:var(--muted);border:1px solid var(--line);
    border-radius:8px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer;
    transition:color .15s,border-color .15s;
  }
  button.ghost:hover{color:var(--text);border-color:#414b59}

  /* ---- 多轮：每一轮是一条「问 + 答」 ---- */
  .turn{margin-bottom:20px;animation:turnIn .18s ease-out}
  @keyframes turnIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .turn-q{
    display:flex;gap:8px;align-items:baseline;font-size:14px;
    color:var(--text-2);margin-bottom:9px;
  }
  .turn-q::before{
    content:"问";flex:none;font-size:11px;color:var(--muted);
    border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:16px;
  }
  /* 补全结果单独一行：用户能看到「它把我的话理解成了什么」，
     补错了一眼就能看出来，不用对着答案猜。 */
  .turn-resolved{
    font-size:12.5px;color:var(--muted);margin:-3px 0 9px 30px;
    display:flex;gap:6px;align-items:baseline;
  }
  .turn-resolved b{color:#9fb4cc;font-weight:500}

  /* ---- 示例 ---- */
  .examples{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .chip{
    background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:20px;padding:5px 12px;font-size:12.5px;cursor:pointer;
    transition:all .15s;font-family:inherit;
  }
  .chip:hover{border-color:#414b59;color:var(--text-2)}
  .chip .tag{color:var(--accent);margin-right:4px}

  /* ---- 结果 ---- */
  #out{margin-top:26px}
  .empty{
    text-align:center;color:#5a6474;font-size:13px;padding:38px 0;
    border:1px dashed var(--line-soft);border-radius:var(--radius);
  }
  .card{
    background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);overflow:hidden;
    animation:rise .28s ease-out;
  }
  /* 只动位移不动透明度：入场动画在慢设备或截图工具里可能停在第一帧，
     一旦第一帧是 opacity:0，整张卡片就“消失”了。宁可少一点淡入。 */
  @keyframes rise{from{transform:translateY(6px)}to{transform:none}}
  .card-head{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:12px 18px;border-bottom:1px solid var(--line-soft);
  }
  .badge{
    font-size:11.5px;padding:2px 8px;border-radius:5px;font-weight:500;
    border:1px solid transparent;
  }
  .badge.ok{background:rgba(63,185,80,.12);color:#5cd06f;border-color:rgba(63,185,80,.22)}
  .badge.refuse{background:rgba(125,136,153,.12);color:#98a3b3;border-color:rgba(125,136,153,.22)}
  .badge.fb{background:rgba(210,153,34,.12);color:#e0ac45;border-color:rgba(210,153,34,.25)}
  .badge.warn{background:rgba(88,166,255,.10);color:#79b8ff;border-color:rgba(88,166,255,.25);cursor:help}
  .badge.cache{background:rgba(125,136,153,.10);color:#8b96a6;border-color:rgba(125,136,153,.22);cursor:help}
  .badge.mode{background:var(--accent-dim);color:#f07579;border-color:#3d1c1f}
  .metrics{margin-left:auto;font:12px/1 var(--mono);color:var(--muted);white-space:nowrap}

  /* 复合拆解：这句话被拆成了哪几路。拆解模式唯一需要解释的东西，
     不摊开的话用户只会看到「这次怎么慢了 1 秒」。 */
  .subs{
    display:flex;flex-wrap:wrap;align-items:center;gap:6px;
    padding:0 18px 14px;
  }
  .subs-label{font-size:12px;color:var(--muted);margin-right:2px}
  .sub-chip{
    font-size:12px;padding:2px 8px;border-radius:5px;
    background:rgba(229,72,77,.09);color:#f07579;border:1px solid #3d1c1f;
  }

  .answer{padding:20px 18px;font-size:15.5px;line-height:1.9;color:var(--text);white-space:pre-wrap}
  .answer.refused{color:var(--muted);font-size:14px}
  /* 拒答时补一句「为什么拒」：只显示「资料不足」，看的人没法判断是
     语料没有、还是分数差一点、还是兜底没开。这三个原因的处理方式完全不同。 */
  .why{
    padding:0 18px 16px;font-size:12.5px;line-height:1.8;color:#6b7686;
    border-top:1px dashed var(--line-soft);margin-top:-4px;padding-top:12px;
  }
  .why b{color:var(--text-2);font-weight:500;font-family:var(--mono);font-size:12px}

  .srcs{border-top:1px solid var(--line-soft);padding:6px 18px 16px}
  .srcs-title{
    font-size:11.5px;letter-spacing:.06em;color:#5f6a7a;
    text-transform:uppercase;padding:12px 0 8px;
  }
  .src{
    position:relative;padding:10px 12px 10px 14px;margin-bottom:6px;
    background:var(--panel-2);border-radius:8px;
  }
  .src::before{
    content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;
    background:var(--accent);border-radius:2px;opacity:.65;
  }
  .src-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .src-topic{font-size:13px;font-weight:550;color:var(--text)}
  .src-id{font:11px/1 var(--mono);color:#5f6a7a}
  .src-score{margin-left:auto;font:12px/1 var(--mono);color:var(--ok)}
  .src-score.mid{color:var(--warn)}
  .src-score.low{color:var(--muted)}
  .src-text{font-size:13px;line-height:1.75;color:var(--text-2)}

  .err{
    background:var(--accent-dim);border:1px solid #4a2326;border-radius:var(--radius);
    padding:16px 18px;color:#f2a3a5;font-size:13.5px;white-space:pre-wrap;
  }
  .err b{display:block;margin-bottom:4px;color:#ff7b7f;font-size:13px}

  /* 加载 */
  .loading{display:flex;align-items:center;gap:10px;padding:26px 18px;color:var(--muted);font-size:13px}
  .spin{
    width:13px;height:13px;border:2px solid #2c3540;border-top-color:var(--accent);
    border-radius:50%;animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line-soft);
    font-size:12px;color:#596373;line-height:1.9}
  footer code{font-family:var(--mono);font-size:11.5px;color:#7d8899;
    background:var(--panel-2);padding:1px 5px;border-radius:4px}

  @media (max-width:560px){
    .wrap{padding:28px 16px 60px}
    h1{font-size:22px}
    .metrics{width:100%;margin-left:0;margin-top:6px}
    .answer{padding:16px 14px;font-size:15px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="kicker"><span class="dot" id="dot"></span><span id="status">连接中</span></div>
    <h1>健身知识库问答<br><span>两段式检索 + 生成层兜底</span></h1>
    <p class="sub" id="cfg">正在读取服务配置…</p>
  </header>

  <section class="ask">
    <textarea id="q" rows="2" placeholder="问点什么，比如「深蹲膝盖要不要过脚尖」"></textarea>
    <div class="row">
      <div class="ctl">
        检索
        <select id="mode">
          <option value="rerank">精排 rerank（默认）</option>
          <option value="multi">复合拆解 multi</option>
          <option value="vector">纯向量 vector</option>
          <option value="oral">口语改写 oral</option>
        </select>
      </div>
      <label class="ctl switch">
        <input type="checkbox" id="fb" checked>
        生成层兜底
      </label>
      <div class="spacer"></div>
      <button class="ghost" id="newchat" title="清空上文，从新的一段对话开始">新对话</button>
      <button class="primary" id="go">提问</button>
    </div>
    <div class="code-row" id="codewrap">
      <input id="code" type="password" placeholder="访问口令（转发链接时一起给）"
             autocomplete="off">
      <button id="codesave">保存</button>
      <span class="hint" id="codetip">这台服务需要口令，浏览器会记住</span>
    </div>
  </section>

  <div class="examples" id="examples"></div>

  <div id="out"><div class="empty">还没有提问。点上面的示例，或自己写一个问题。</div></div>

  <footer>
    精排分数低于阈值会被判「资料不足」，此时兜底会把 top-2 弱相关资料交给生成层终审。<br>
    接口：<code>POST /rag</code> · <code>GET /meta</code> · <code>GET /breaker</code> · <code>GET /kb?q=</code>
  </footer>

</div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var out = $('#out'), btn = $('#go'), ta = $('#q');
  var busy = false;
  var META = null;          // /meta 的返回，拒答时要拿阈值来解释原因
  // 会话号由**客户端**生成，服务端只负责记。
  // 为什么不服务端发：那样第一轮就得先请求一次「给我个号」，多一个来回；
  // 或者让 /rag 在没带号时自动造一个 —— 但那样「单轮调用」就变成了
  // 「每次都是新会话的开始」，服务端会话表会被纯单轮流量灌满。
  // 号码不是密钥，可猜无所谓，能对上就行。
  // 只放在内存里，刷新即新对话：存 localStorage 反而会让人以为它在服务端是持久的。
  var SID = null;
  function newSid() {
    if (window.crypto && crypto.randomUUID) {
      return crypto.randomUUID().replace(/-/g, '').slice(0, 12);
    }
    return 's' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  }

  var EXAMPLES = [
    { tag: '书面', q: '推日都练哪些部位？' },
    { tag: '口语', q: '每次吸气要吸到多满才算够？' },
    { tag: '该拒', q: '帮我写一首关于春天的诗' },
    { tag: '边界', q: '深蹲膝盖要不要过脚尖？' }
  ];

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* 模型爱输出 **加粗**，textContent 一排会导致正文里露出四个星号。
     只认这一种标记：先转义再替换，不做完整 markdown ——
     答案里真出现的 < 必须还是原文，不能变成标签。 */
  function mdBold(node, text) {
    var esc = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    node.innerHTML = esc.replace(/\*\*([^*\n]{1,40})\*\*/g, '<b>$1</b>');
  }

  /* ---- 口令 ----
     为什么要 localStorage 而不是每次手输：链接会被转发，转发的人不该知道口令，
     但拿到「链接 + 口令」的人希望点开就能用。?k=xxx 进来一次就记住，
     之后清缓存才会再问。口令只放在请求头，不写进 URL（URL 会进日志和 Referer）。 */
  var CODE_KEY = 'hello-ai-code';
  var code = new URLSearchParams(location.search).get('k') || '';
  if (code) {
    localStorage.setItem(CODE_KEY, code);
    // 把 k 从地址栏抹掉，免得被复制到聊天记录里
    var clean = new URLSearchParams(location.search);
    clean.delete('k');
    history.replaceState(null, '', location.pathname + (clean.toString() ? '?' + clean : ''));
  } else {
    code = localStorage.getItem(CODE_KEY) || '';
  }

  function showCode(why) {
    $('#codewrap').classList.add('on');
    if (why) $('#codetip').textContent = why;
    $('#code').focus();
  }

  function authHeaders() {
    var h = { 'Content-Type': 'application/json' };
    if (code) h['X-Access-Code'] = code;
    return h;
  }

  $('#codesave').onclick = function () {
    var v = $('#code').value.trim();
    if (!v) return;
    code = v;
    localStorage.setItem(CODE_KEY, v);
    $('#codewrap').classList.remove('on');
    $('#codetip').textContent = '这台服务需要口令，浏览器会记住';
    ta.focus();
  };
  $('#code').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); $('#codesave').click(); }
  });

  /* ---- 顶部配置 ---- */
  fetch('/meta').then(function (r) { return r.json(); }).then(function (m) {
    META = m;
    $('#dot').className = 'dot ok';
    $('#status').textContent = '服务正常';
    $('#cfg').innerHTML =
      '<b>' + m.kb_chunks + '</b> 条语料 / <b>' + m.kb_topics + '</b> 个话题 · ' +
      '精排 <b>' + m.rerank_model.split('/').pop() + '</b> · ' +
      '阈值 <b>' + m.rerank_threshold + '</b> · ' +
      '兜底 <b>' + (m.fallback_enabled ? '开启' : '关闭') + '</b>' +
      (m.multiturn ? ' · 多轮 <b>' +
        (m.condense_mode === 'always' ? '每轮补全' : '按需补全') + '</b>' : ' · 多轮 <b>关闭</b>') +
      // 拆解默认是关的，但「检索」下拉里能手动选 multi，所以这里只报状态不报开关
      (m.decomp_mode && m.decomp_mode !== 'off'
        ? ' · 拆解 <b>' + m.decomp_mode + '</b>' : '');
    if (m.auth_required && !code) showCode('这台服务需要访问口令');
  }).catch(function () {
    $('#dot').className = 'dot err';
    $('#status').textContent = '服务未响应';
    $('#cfg').textContent = '后端没起来，先运行 uvicorn 或 docker compose up';
  });

  /* ---- 示例 ---- */
  EXAMPLES.forEach(function (e) {
    var b = el('button', 'chip');
    b.appendChild(el('span', 'tag', e.tag));
    b.appendChild(document.createTextNode(e.q));
    b.onclick = function () { ta.value = e.q; ask(e.q); };
    $('#examples').appendChild(b);
  });

  /* ---- 渲染 ---- */
  function whyBox(d) {
    var parts = [];
    var top = d.ranking && d.ranking[0];
    if (top && typeof top.score === 'number' && META) {
      parts.push('精排最高分 ' + top.score.toFixed(3) + '，阈值 ' + META.rerank_threshold);
    }
    if ($('#fb').checked) {
      parts.push('已交给生成层终审，它也认为资料不足');
    } else {
      parts.push('生成层兜底已关闭');
    }
    var box = el('div', 'why');
    box.appendChild(document.createTextNode(parts.join('；') + '。'));
    if (top && top.topic && top.score > 0) {
      box.appendChild(document.createTextNode('最接近的话题是「' + top.topic + '」。'));
    }
    return box;
  }

  function render(q, d, ms) {
    var srcs = d.sources || [];
    var refused = srcs.length === 0;

    // 多轮：会话号由服务端发，客户端只负责带回去。
    // 不自己生成是为了让「会话」这件事只有一个真相来源 ——
    // 两边各生成一个 id，迟早有一边记的和另一边不一样。
    if (d.session_id) SID = d.session_id;   // 服务端回什么就用什么，保持一个真相

    var turn = el('div', 'turn');
    var qline = el('div', 'turn-q');
    qline.appendChild(el('span', null, q));
    if (d.history_turns) {
      qline.appendChild(el('span', 'badge cache', '第 ' + (d.history_turns + 1) + ' 轮'));
    }
    turn.appendChild(qline);

    // 补全过才显示：这句话单独看没意义，是上文把它补成这样的
    if (d.condensed && d.resolved_question) {
      var rl = el('div', 'turn-resolved');
      rl.appendChild(el('span', null, '结合上文理解为'));
      rl.appendChild(el('b', null, d.resolved_question));
      turn.appendChild(rl);
    }

    var card = el('div', 'card');
    var head = el('div', 'card-head');

    if (refused) {
      head.appendChild(el('span', 'badge refuse', '资料不足'));
    } else if (d.fallback_used) {
      head.appendChild(el('span', 'badge fb', '生成层兜底'));
    } else {
      head.appendChild(el('span', 'badge ok', '精排命中'));
    }
    head.appendChild(el('span', 'badge mode', d.mode || 'rerank'));

    // 缓存命中：这次没有重新检索，答案和第一次完全一样。
    // 不说清楚的话，用户会以为「秒回」是因为问得简单。
    if (d.cached) {
      var cb = el('span', 'badge cache', '命中缓存');
      cb.title = '这条问题之前答过，直接复用了上次的结果（tokens 记 0）';
      head.appendChild(cb);
    }

    // 贴线提醒：这次判定离门线不到 0.006，同一句话重跑有可能翻面。
    // 只做提示，不改结论 —— 改判定的地方只有后端的 pick_hits 一处。
    if (d.uncertain) {
      var u = el('span', 'badge warn', '判定贴线');
      u.title = '这次判定离门线不到 UNCERTAIN_BAND（默认 0.006），同一句话重跑可能给出相反结论';
      head.appendChild(u);
    }

    var meta = [];
    meta.push((ms / 1000).toFixed(2) + 's');
    // 补全那一段单独报出来：不然「多轮怎么慢了一秒」只能靠猜
    if (d.timings && d.timings.condense_ms) {
      meta.push('其中补全 ' + (d.timings.condense_ms / 1000).toFixed(2) + 's');
    }
    // 拆解也单独报：multi 模式慢的那一秒大概率花在这里，
    // 混进总耗时里会让人以为「检索变慢了」。
    if (d.timings && d.timings.decomp_ms) {
      meta.push('其中拆解 ' + (d.timings.decomp_ms / 1000).toFixed(2) + 's');
    }
    if (!refused) meta.push(srcs.length + ' 段');
    if (d.tokens) meta.push(d.tokens + ' tok');
    head.appendChild(el('span', 'metrics', meta.join('  ·  ')));

    card.appendChild(head);
    var ans = el('div', refused ? 'answer refused' : 'answer');
    mdBold(ans, d.answer || '（空）');
    card.appendChild(ans);

    // 拆成哪几路：拒答时也要显示。负例被拆成两路却仍然拒答，这件事本身
    // 就说明了「拆解不会把拒答打开」—— 藏起来反而像它没生效。
    if (d.sub_questions && d.sub_questions.length) {
      var subs = el('div', 'subs');
      subs.appendChild(el('span', 'subs-label', '拆成 ' + d.sub_questions.length + ' 路'));
      d.sub_questions.forEach(function (s) {
        subs.appendChild(el('span', 'sub-chip', s));
      });
      card.appendChild(subs);
    }
    if (refused) card.appendChild(whyBox(d));

    if (!refused) {
      var box = el('div', 'srcs');
      box.appendChild(el('div', 'srcs-title', '引用来源'));
      srcs.forEach(function (s) {
        var item = el('div', 'src');
        var top = el('div', 'src-top');
        top.appendChild(el('span', 'src-topic', s.topic));
        top.appendChild(el('span', 'src-id', s.id));
        var sc = el('span', 'src-score');
        sc.textContent = (s.score != null ? s.score.toFixed(3) : '--');
        if (s.score != null && s.score < 0.95) sc.className += ' mid';
        if (s.score != null && s.score < 0.80) sc.className += ' low';
        top.appendChild(sc);
        item.appendChild(top);
        item.appendChild(el('div', 'src-text', s.text));
        box.appendChild(item);
      });
      card.appendChild(box);
    }

    turn.appendChild(card);
    out.appendChild(turn);
    // 新一轮进来时滚到底部：多轮里最该看见的永远是最新那条
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  function fail(msg, q) {
    // 之前这里是 out.innerHTML=''，单轮时代没问题；多轮里那等于
    // 「问错一句就把前面聊过的全擦了」。现在只追加一条错误。
    var turn = el('div', 'turn');
    if (q) turn.appendChild(el('div', 'turn-q')).appendChild(el('span', null, q));
    var box = el('div', 'err');
    box.appendChild(el('b', null, '请求失败'));
    box.appendChild(document.createTextNode(msg));
    turn.appendChild(box);
    out.appendChild(turn);
  }

  /* ---- 提问 ---- */
  function ask(q) {
    q = (q || '').trim();
    if (!q || busy) return;
    busy = true;
    btn.disabled = true;

    if (!SID) SID = newSid();

    // 空状态只擦一次，之后的每一轮都往后追加
    var empty = out.querySelector('.empty');
    if (empty) out.innerHTML = '';

    var ld = el('div', 'card');
    var lw = el('div', 'loading');
    lw.appendChild(el('div', 'spin'));
    lw.appendChild(el('span', null, '检索中：向量召回 → 精排 → 生成' +
      (SID ? '（含上文补全）' : '')));
    ld.appendChild(lw);
    var ldTurn = el('div', 'turn');
    ldTurn.appendChild(ld);
    out.appendChild(ldTurn);

    var body0 = null;
    var mode = $('#mode').value;
    var fb = $('#fb').checked ? '1' : '0';
    var t0 = performance.now();

    // 必须 return：?q= 连续问下去靠的就是这个 promise 串行
    return fetch('/rag?mode=' + encodeURIComponent(mode) + '&fallback=' + fb, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ question: q, session_id: SID })
    }).then(function (r) {
      var ms = performance.now() - t0;
      return r.json().then(function (body) {
        if (ldTurn.parentNode) ldTurn.parentNode.removeChild(ldTurn);
        body0 = body;
        if (r.ok) { render(q, body, ms); return; }

        var detail = body && body.detail;
        if (typeof detail !== 'string') detail = JSON.stringify(detail || body);

        // 401 和 429 是「能自己解决」的两类，不该跟 500 一样丢一坨红字：
        // 401 直接把口令框调出来，429 告诉用户等几秒，别让人以为服务坏了。
        if (r.status === 401) {
          code = '';
          localStorage.removeItem(CODE_KEY);
          showCode('口令不对，重新输一次');
          throw new Error('需要访问口令。拿到口令后填在上面的输入框里。');
        }
        if (r.status === 429) {
          var wait = r.headers.get('Retry-After');
          throw new Error(detail + (wait ? '（约 ' + wait + ' 秒）' : ''));
        }
        throw new Error('HTTP ' + r.status + '\n' + detail);
      });
    }).catch(function (e) {
      if (ldTurn.parentNode) ldTurn.parentNode.removeChild(ldTurn);
      fail(e.message || String(e), q);
    }).then(function () {
      busy = false;
      btn.disabled = false;
      return body0;                    // 交回这一轮的返回体，方便串行复现整段对话
    });
  }

  $('#newchat').onclick = function () {
    if (SID) {                       // 服务端那份也删掉，不留半个会话在那儿
      fetch('/session/' + encodeURIComponent(SID), {
        method: 'DELETE', headers: authHeaders()
      }).catch(function () {});
    }
    SID = null;
    out.innerHTML = '<div class="empty">新对话。上一段已经清掉了，这一句不会带上任何上文。</div>';
    ta.value = '';
    ta.focus();
  };

  btn.onclick = function () { ask(ta.value); };
  ta.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      ask(ta.value);
    }
  });

  /* 支持 ?q=问题 直接提问，方便把「这个问题在这套系统里的表现」作为链接发给别人。
     支持重复多个 ?q=：按顺序问下去，问的就是**同一段多轮对话** ——
     想跟人说明「追问到底有没有用」，发一条链接比截图强。
     ?mode=multi 让链接直接落在拆解模式上：不然「对比两种模式」得让对方
     自己去下拉框里找，十次有八次找错。 */
  (function pickMode() {
    var want = new URLSearchParams(location.search).get('mode');
    if (!want) return;
    var sel = $('#mode');
    for (var i = 0; i < sel.options.length; i++) {
      if (sel.options[i].value === want) { sel.value = want; return; }
    }
  })();

  var presets = new URLSearchParams(location.search).getAll('q');
  (function runPreset(i) {
    if (i >= presets.length) return;
    ta.value = presets[i];
    ask(presets[i]).then(function () { runPreset(i + 1); });
  })(0);
})();
</script>
</body>
</html>
