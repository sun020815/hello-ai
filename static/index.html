<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>健身知识库问答</title>
<style>
  /* 浅色为主，暗色跟随系统。所有颜色只在这两个块里定义，
     正文里不允许出现硬编码色值 —— 否则暗色模式下会有一半元素瞎掉。 */
  :root{
    --bg:#ffffff;
    --bg-soft:#f9f9fa;
    --panel:#f5f5f7;
    --panel-2:#fafafa;
    --line:#ebebee;
    --line-2:#dedee3;
    --text:#1b1b1f;
    --text-2:#3f3f46;
    --muted:#8e8e97;
    --accent:#4d6bfe;
    --accent-soft:#eef1ff;
    --accent-line:#d6dcff;
    --ok:#127c47;
    --warn:#9a6b16;
    --danger:#d13b3b;
    --danger-soft:#fdf2f2;
    --shadow:0 2px 10px rgba(16,18,26,.05);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --r:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#191a1c;
      --bg-soft:#141517;
      --panel:#242529;
      --panel-2:#1f2023;
      --line:#2c2d31;
      --line-2:#3a3b40;
      --text:#ececef;
      --text-2:#c3c4ca;
      --muted:#8b8c94;
      --accent:#7b90ff;
      --accent-soft:#232840;
      --accent-line:#333c5e;
      --ok:#4fc07f;
      --warn:#d8a545;
      --danger:#f0736f;
      --danger-soft:#2b1d1e;
      --shadow:0 2px 10px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;overflow:hidden;
  }

  /* ---- 顶栏：一条细线，不放重量级标题 ---- */
  .topbar{
    flex:none;display:flex;align-items:center;gap:10px;
    height:54px;padding:0 20px;border-bottom:1px solid var(--line);
    background:var(--bg);
  }
  .brand{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
  .logo{
    width:24px;height:24px;border-radius:7px;flex:none;
    background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:700;
  }
  .top-right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--muted)}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--line-2);transition:background .3s;flex:none}
  .dot.ok{background:var(--ok)}
  .dot.err{background:var(--danger)}
  .status{display:flex;align-items:center;gap:6px}
  .cfg-btn{
    background:transparent;border:1px solid var(--line);border-radius:8px;
    color:var(--muted);font:inherit;font-size:12.5px;padding:3px 10px;cursor:pointer;
  }
  .cfg-btn:hover{background:var(--panel);color:var(--text-2)}

  /* 服务配置默认收起：它是给「想核对数字的人」看的，不该占首屏 */
  .cfgpane{flex:none;border-bottom:1px solid var(--line);background:var(--bg-soft);display:none}
  .cfgpane.on{display:block}
  .cfgpane .inner{padding:10px 20px;font-size:12.5px;line-height:1.9;color:var(--muted)}
  .cfgpane b{color:var(--text-2);font-weight:500}
  .cfgpane .close{float:right;cursor:pointer;color:var(--muted)}
  .cfgpane .close:hover{color:var(--text-2)}

  /* ---- 滚动区 ---- */
  main{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
  .feed{
    max-width:768px;margin:0 auto;padding:28px 20px 8px;
    min-height:100%;display:flex;flex-direction:column;
  }
  #out{display:flex;flex-direction:column;flex:1}

  /* ---- 空状态：居中标题 + 示例。上下 auto 边距把整块压在视口中线，
     一旦有对话 .empty 就没了，auto 边距随之失效，正常从上往下排。 ---- */
  .empty{margin:auto 0;padding:20px 0;text-align:center}
  .hero-logo{
    width:46px;height:46px;border-radius:14px;margin:0 auto 18px;
    background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:700;box-shadow:0 6px 18px rgba(77,107,254,.22);
  }
  .empty h1{font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1.4}
  .empty .sub{margin-top:10px;color:var(--muted);font-size:13.5px}

  .examples{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
    margin:26px auto 0;max-width:620px;text-align:left;
  }
  .chip{
    display:flex;align-items:flex-start;gap:9px;width:100%;
    background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
    padding:11px 13px;font:inherit;font-size:13.5px;line-height:1.55;
    color:var(--text-2);cursor:pointer;text-align:left;
    transition:background .15s,border-color .15s;
  }
  .chip:hover{background:var(--panel-2);border-color:var(--line-2)}
  .chip .tag{
    flex:none;font-size:11px;line-height:18px;padding:0 6px;border-radius:5px;
    background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);
    font-weight:500;
  }

  /* ---- 对话 ---- */
  .turn{padding:14px 0}
  .turn + .turn{border-top:1px solid var(--line)}
  .turn-q{display:flex;justify-content:flex-end;margin-bottom:12px}
  .turn-q .bubble{
    max-width:82%;background:var(--panel);color:var(--text);
    border-radius:18px 18px 4px 18px;padding:9px 15px;
    font-size:14.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;
  }
  /* 补全结果：让用户看到「它把我的话理解成了什么」，补错了一眼就知道 */
  .turn-resolved{
    display:flex;gap:6px;align-items:baseline;justify-content:flex-end;
    margin:-6px 2px 12px;font-size:12.5px;color:var(--muted);
  }
  .turn-resolved b{color:var(--text-2);font-weight:500}

  /* 状态行：徽章做重了就不像产品了。这里只留一个小圆点 + 灰字，
     模式仍然给一个浅色胶囊 —— 它是会被手动切换的，得看得见。 */
  .cbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:8px}
  .cbar .tag{position:relative;font-size:12px;line-height:18px;color:var(--muted);padding-left:11px}
  .cbar .tag::before{
    content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:5px;height:5px;border-radius:50%;background:var(--line-2);
  }
  .cbar .tag.ok{color:var(--ok)}
  .cbar .tag.ok::before{background:var(--ok)}
  .cbar .tag.fb{color:var(--warn)}
  .cbar .tag.fb::before{background:var(--warn)}
  .cbar .tag.mode{
    color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);
    padding:1px 8px;border-radius:6px;line-height:17px;
  }
  .cbar .tag.mode::before{display:none}
  .cbar .tag.hint{cursor:help;text-decoration:underline dotted;text-underline-offset:3px}
  .cbar .metrics{margin-left:auto;font:11.5px/1 var(--mono);color:var(--muted)}

  .answer{font-size:15.5px;line-height:1.85;color:var(--text);white-space:pre-wrap;word-break:break-word}
  .answer b{font-weight:600}
  .answer .para{margin-bottom:9px}
  .answer .para:last-child{margin-bottom:0}
  /* 模型爱用「- 」列点。原样输出会看到一串裸短横，这里认得三种标记就够了，
     不追求完整 markdown —— 认不出来的就当正文。 */
  .answer ul,.answer ol{margin:4px 0 10px 0;padding-left:20px}
  .answer li{margin:3px 0;line-height:1.8}
  .answer ul li{list-style:disc}
  .answer ol li{list-style:decimal}
  .answer.refused{color:var(--muted);font-size:14.5px}

  .subs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px}
  .subs-label{font-size:12px;color:var(--muted)}
  .sub-chip{
    font-size:12px;padding:2px 9px;border-radius:20px;
    background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);
  }

  .why{margin-top:10px;font-size:12.5px;line-height:1.8;color:var(--muted)}
  .why b{color:var(--text-2);font-weight:500;font-family:var(--mono);font-size:12px}

  /* ---- 来源：默认折叠。折叠是为了「第一眼像产品」，点开才看证据 ---- */
  details.srcs{margin-top:14px}
  details.srcs summary{
    display:inline-flex;align-items:center;gap:6px;cursor:pointer;list-style:none;
    font-size:12.5px;color:var(--muted);padding:3px 10px 3px 8px;
    border:1px solid var(--line);border-radius:20px;background:var(--bg);
    user-select:none;
  }
  details.srcs summary::-webkit-details-marker{display:none}
  details.srcs summary:hover{background:var(--panel-2);color:var(--text-2)}
  details.srcs summary .caret{
    width:5px;height:5px;flex:none;margin:-2px 2px 0 1px;
    border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;
    transform:rotate(-45deg);transition:transform .18s;
  }
  details.srcs[open] summary .caret{transform:rotate(45deg);margin-top:-4px}
  .src-list{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .src{
    background:var(--panel-2);border:1px solid var(--line);border-radius:12px;
    padding:11px 13px;
  }
  .src-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .src-topic{font-size:13px;font-weight:600;color:var(--text-2)}
  .src-id{font:11px/1 var(--mono);color:var(--muted)}
  .src-score{margin-left:auto;font:11.5px/1 var(--mono);color:var(--ok)}
  .src-score.mid{color:var(--warn)}
  .src-score.low{color:var(--muted)}
  .src-text{font-size:12.5px;line-height:1.75;color:var(--muted);white-space:pre-wrap}

  .err{
    margin-top:10px;background:var(--danger-soft);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;color:var(--danger);font-size:13px;
    white-space:pre-wrap;line-height:1.7;
  }
  .err b{display:block;margin-bottom:3px}

  /* 加载：三点呼吸，比转圈更像在「想」 */
  .loading{display:flex;align-items:center;gap:5px;padding:10px 0 4px;color:var(--muted);font-size:12.5px}
  .loading .dots{display:flex;gap:4px;margin-right:4px}
  .loading .dots i{
    width:5px;height:5px;border-radius:50%;background:var(--muted);
    animation:breathe 1.1s infinite ease-in-out;
  }
  .loading .dots i:nth-child(2){animation-delay:.15s}
  .loading .dots i:nth-child(3){animation-delay:.3s}
  @keyframes breathe{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}

  /* ---- 输入区：贴底悬浮，圆角大框 ---- */
  .composer{flex:none;background:var(--bg);padding:10px 20px 18px}
  .composer .box{
    max-width:768px;margin:0 auto;
    border:1px solid var(--line-2);border-radius:22px;
    background:var(--bg);box-shadow:var(--shadow);
    padding:12px 12px 9px;transition:border-color .18s,box-shadow .18s;
  }
  .box:focus-within{border-color:var(--accent);box-shadow:0 2px 14px rgba(77,107,254,.13)}
  textarea{
    width:100%;background:transparent;border:0;outline:0;resize:none;
    color:var(--text);font:inherit;font-size:15px;line-height:1.65;
    min-height:26px;max-height:160px;padding:2px 4px;
  }
  textarea::placeholder{color:var(--muted)}
  .tools{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
  .spacer{flex:1}

  /* 选模式：无边框文本按钮，不是下拉框的方块感 */
  .modewrap{position:relative;display:inline-flex;align-items:center}
  .modewrap::after{
    content:"";position:absolute;right:8px;top:50%;width:5px;height:5px;
    border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);
    transform:translateY(-70%) rotate(45deg);pointer-events:none;
  }
  select{
    appearance:none;-webkit-appearance:none;
    background:transparent;border:0;border-radius:9px;
    color:var(--muted);font:inherit;font-size:12.5px;
    padding:5px 22px 5px 9px;cursor:pointer;outline:0;
  }
  select:hover{background:var(--panel);color:var(--text-2)}

  .tgl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);
    cursor:pointer;user-select:none;padding:5px 8px;border-radius:9px}
  .tgl:hover{background:var(--panel);color:var(--text-2)}
  .tgl input{accent-color:var(--accent);cursor:pointer;width:13px;height:13px}

  button.ghost{
    background:transparent;border:0;color:var(--muted);font:inherit;font-size:12.5px;
    padding:5px 10px;border-radius:9px;cursor:pointer;
  }
  button.ghost:hover{background:var(--panel);color:var(--text-2)}

  /* 发送键：圆形实心，唯一的饱和色块 */
  button.send{
    width:32px;height:32px;flex:none;border:0;border-radius:50%;
    background:var(--accent);color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:filter .15s,opacity .15s;
  }
  button.send:hover{filter:brightness(1.08)}
  button.send:disabled{opacity:.35;cursor:not-allowed}
  button.send svg{width:15px;height:15px;display:block}

  /* 口令行：只在服务端配了 ACCESS_CODE 时出现，本地跑永远看不到 */
  .code-row{display:none;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
  .code-row.on{display:flex}
  .code-row input{
    flex:1;min-width:170px;background:var(--bg-soft);border:1px solid var(--line);
    border-radius:9px;padding:7px 11px;color:var(--text);font:inherit;font-size:13px;outline:none;
  }
  .code-row input:focus{border-color:var(--accent)}
  .code-row button{
    background:var(--panel);border:1px solid var(--line);color:var(--text-2);
    border-radius:9px;padding:7px 14px;font:inherit;font-size:12.5px;cursor:pointer;
  }
  .code-row button:hover{border-color:var(--line-2)}
  .code-row .hint{font-size:12px;color:var(--muted)}

  .foot{
    max-width:768px;margin:6px auto 0;text-align:center;
    font-size:11.5px;color:var(--muted);
  }
  .foot code{font-family:var(--mono);font-size:11px}

  @media (max-width:640px){
    .examples{grid-template-columns:1fr}
    .empty h1{font-size:21px}
    .feed{padding:20px 14px 8px}
    .composer{padding:8px 12px 14px}
    .turn-q .bubble{max-width:90%}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="logo">健</span><span>健身知识库</span></div>
  <div class="top-right">
    <span class="status"><span class="dot" id="dot"></span><span id="status">连接中</span></span>
    <button class="cfg-btn" id="cfgbtn">服务配置</button>
  </div>
</header>

<div class="cfgpane" id="cfgpane">
  <div class="inner">
    <span class="close" id="cfgclose">收起</span>
    <div id="cfg">正在读取服务配置…</div>
  </div>
</div>

<main id="scroller">
  <div class="feed">
    <div id="out">
      <div class="empty">
        <div class="hero-logo">健</div>
        <h1>训练上的事，问我</h1>
        <p class="sub">只回答训练相关的问题。库里没有的，它会直说没有。</p>
        <div class="examples" id="examples"></div>
      </div>
    </div>
  </div>
</main>

<div class="composer">
  <div class="box">
    <textarea id="q" rows="1" placeholder="问点什么，比如「深蹲膝盖要不要过脚尖」"></textarea>
    <div class="tools">
      <span class="modewrap">
        <select id="mode" aria-label="检索模式">
          <option value="rerank">精排</option>
          <option value="multi">复合拆解</option>
          <option value="vector">纯向量</option>
          <option value="oral">口语改写</option>
        </select>
      </span>
      <label class="tgl" title="精排拒答后，把弱相关资料交给生成层判断能不能答">
        <input type="checkbox" id="fb" checked>
        生成层兜底
      </label>
      <span class="spacer"></span>
      <button class="ghost" id="newchat" title="清空上文，从新的一段对话开始">新对话</button>
      <button class="send" id="go" title="发送（Enter）" aria-label="发送">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
      </button>
    </div>
    <div class="code-row" id="codewrap">
      <input id="code" type="password" placeholder="访问口令（转发链接时一起给）"
             autocomplete="off">
      <button id="codesave">保存</button>
      <span class="hint" id="codetip">这台服务需要口令，浏览器会记住</span>
    </div>
  </div>
  <div class="foot">
    精排分数低于阈值判「资料不足」，兜底把 top-2 弱相关资料交给生成层终审 ·
    <code>POST /rag</code>
  </div>
</div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var out = $('#out'), btn = $('#go'), ta = $('#q'), scroller = $('#scroller');
  var busy = false;
  var META = null;          // /meta 的返回，拒答时要拿阈值来解释原因
  // 会话号由**客户端**生成，服务端只负责记。
  // 为什么不服务端发：那样第一轮就得先请求一次「给我个号」，多一个来回；
  // 或者让 /rag 在没带号时自动造一个 —— 但那样「单轮调用」就变成了
  // 「每次都是新会话的开始」，服务端会话表会被纯单轮流量灌满。
  // 号码不是密钥，可猜无所谓，能对上就行。
  // 只放在内存里，刷新即新对话：存 localStorage 反而会让人以为它在服务端是持久的。
  var SID = null;
  function newSid() {
    if (window.crypto && crypto.randomUUID) {
      return crypto.randomUUID().replace(/-/g, '').slice(0, 12);
    }
    return 's' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  }

  var EXAMPLES = [
    { tag: '书面', q: '推日都练哪些部位？' },
    { tag: '口语', q: '每次吸气要吸到多满才算够？' },
    { tag: '该拒', q: '帮我写一首关于春天的诗' },
    { tag: '边界', q: '深蹲膝盖要不要过脚尖？' }
  ];

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* 模型爱输出 **加粗**，textContent 一排会导致正文里露出四个星号。
     只认这一种标记：先转义再替换，不做完整 markdown ——
     答案里真出现的 < 必须还是原文，不能变成标签。 */
  function mdBold(node, text) {
    var esc = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    node.innerHTML = esc.replace(/\*\*([^*\n]{1,40})\*\*/g, '<b>$1</b>');
  }

  /* 答案排版：认得「- 」「• 」「1. 」三种列点，其余按段落走。
     只做这一层，不引 markdown 库 —— 容器要能离线打开，也不值得为三段格式
     加载几十 KB。认不出来的标记一律当正文，宁可朴素也不要猜错。 */
  function renderAnswer(node, text) {
    var lines = text.split('\n');
    var list = null, kind = null;
    function flush() { if (list) { node.appendChild(list); list = null; kind = null; } }
    lines.forEach(function (raw) {
      var line = raw.replace(/\s+$/, '');
      var ul = /^\s*[-•]\s+(.*)$/.exec(line);
      var ol = /^\s*\d+[.、)]\s+(.*)$/.exec(line);
      if (ul || ol) {
        var want = ul ? 'ul' : 'ol';
        if (!list || kind !== want) { flush(); list = document.createElement(want); kind = want; }
        var li = document.createElement('li');
        mdBold(li, ul ? ul[1] : ol[1]);
        list.appendChild(li);
        return;
      }
      flush();
      if (!line.trim()) return;         // 空行交给段落间距，不再输出一条空 div
      var p = document.createElement('div');
      p.className = 'para';
      mdBold(p, line);
      node.appendChild(p);
    });
    flush();
  }

  function scrollBottom() {
    scroller.scrollTop = scroller.scrollHeight;
  }

  /* ---- 口令 ----
     为什么要 localStorage 而不是每次手输：链接会被转发，转发的人不该知道口令，
     但拿到「链接 + 口令」的人希望点开就能用。?k=xxx 进来一次就记住，
     之后清缓存才会再问。口令只放在请求头，不写进 URL（URL 会进日志和 Referer）。 */
  var CODE_KEY = 'hello-ai-code';
  var code = new URLSearchParams(location.search).get('k') || '';
  if (code) {
    localStorage.setItem(CODE_KEY, code);
    // 把 k 从地址栏抹掉，免得被复制到聊天记录里
    var clean = new URLSearchParams(location.search);
    clean.delete('k');
    history.replaceState(null, '', location.pathname + (clean.toString() ? '?' + clean : ''));
  } else {
    code = localStorage.getItem(CODE_KEY) || '';
  }

  function showCode(why) {
    $('#codewrap').classList.add('on');
    if (why) $('#codetip').textContent = why;
    $('#code').focus();
  }

  function authHeaders() {
    var h = { 'Content-Type': 'application/json' };
    if (code) h['X-Access-Code'] = code;
    return h;
  }

  $('#codesave').onclick = function () {
    var v = $('#code').value.trim();
    if (!v) return;
    code = v;
    localStorage.setItem(CODE_KEY, v);
    $('#codewrap').classList.remove('on');
    $('#codetip').textContent = '这台服务需要口令，浏览器会记住';
    ta.focus();
  };
  $('#code').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); $('#codesave').click(); }
  });

  /* ---- 配置面板：默认收起，点按钮才展开 ---- */
  $('#cfgbtn').onclick = function () {
    var p = $('#cfgpane');
    p.classList.toggle('on');
    if (p.classList.contains('on')) $('#cfgbtn').textContent = '收起配置';
    else $('#cfgbtn').textContent = '服务配置';
  };
  $('#cfgclose').onclick = function () { $('#cfgbtn').click(); };

  /* ---- 顶部配置 ---- */
  fetch('/meta').then(function (r) { return r.json(); }).then(function (m) {
    META = m;
    $('#dot').className = 'dot ok';
    $('#status').textContent = '服务正常';
    $('#cfg').innerHTML =
      '<b>' + m.kb_chunks + '</b> 条语料 / <b>' + m.kb_topics + '</b> 个话题 · ' +
      '精排 <b>' + m.rerank_model.split('/').pop() + '</b> · ' +
      '阈值 <b>' + m.rerank_threshold + '</b> · ' +
      '兜底 <b>' + (m.fallback_enabled ? '开启' : '关闭') + '</b>' +
      (m.multiturn ? ' · 多轮 <b>' +
        (m.condense_mode === 'always' ? '每轮补全' : '按需补全') + '</b>' : ' · 多轮 <b>关闭</b>') +
      // 拆解默认是关的，但「检索」下拉里能手动选 multi，所以这里只报状态不报开关
      (m.decomp_mode && m.decomp_mode !== 'off'
        ? ' · 拆解 <b>' + m.decomp_mode + '</b>' : '');
    if (m.auth_required && !code) showCode('这台服务需要访问口令');
  }).catch(function () {
    $('#dot').className = 'dot err';
    $('#status').textContent = '服务未响应';
    $('#cfg').textContent = '后端没起来，先运行 uvicorn 或 docker compose up';
    // 出错时把配置面板推开：这里正是需要看细节的时候
    if (!$('#cfgpane').classList.contains('on')) $('#cfgbtn').click();
  });

  /* ---- 示例 ---- */
  EXAMPLES.forEach(function (e) {
    var b = el('button', 'chip');
    b.appendChild(el('span', 'tag', e.tag));
    b.appendChild(el('span', null, e.q));
    b.onclick = function () { ta.value = e.q; ask(e.q); };
    $('#examples').appendChild(b);
  });

  /* ---- 渲染 ---- */
  function whyBox(d) {
    var parts = [];
    var top = d.ranking && d.ranking[0];
    if (top && typeof top.score === 'number' && META) {
      parts.push('精排最高分 ' + top.score.toFixed(3) + '，阈值 ' + META.rerank_threshold);
    }
    if ($('#fb').checked) {
      parts.push('已交给生成层终审，它也认为资料不足');
    } else {
      parts.push('生成层兜底已关闭');
    }
    var box = el('div', 'why');
    box.appendChild(document.createTextNode(parts.join('；') + '。'));
    if (top && top.topic && top.score > 0) {
      box.appendChild(document.createTextNode('最接近的话题是「' + top.topic + '」。'));
    }
    return box;
  }

  function srcList(srcs) {
    var wrap = el('details', 'srcs');
    var sum = el('summary');
    var caret = el('span', 'caret');
    sum.appendChild(caret);
    sum.appendChild(el('span', null, '引用来源 · ' + srcs.length + ' 条'));
    wrap.appendChild(sum);

    var list = el('div', 'src-list');
    srcs.forEach(function (s) {
      var item = el('div', 'src');
      var top = el('div', 'src-top');
      top.appendChild(el('span', 'src-topic', s.topic));
      top.appendChild(el('span', 'src-id', s.id));
      var sc = el('span', 'src-score');
      sc.textContent = (s.score != null ? s.score.toFixed(3) : '--');
      if (s.score != null && s.score < 0.95) sc.className += ' mid';
      if (s.score != null && s.score < 0.80) sc.className += ' low';
      top.appendChild(sc);
      item.appendChild(top);
      item.appendChild(el('div', 'src-text', s.text));
      list.appendChild(item);
    });
    wrap.appendChild(list);
    return wrap;
  }

  function render(q, d, ms) {
    // 发出去就把输入框腾空：留着原文很容易让人以为没发成功，再点一次
    ta.value = '';
    ta.style.height = 'auto';

    var srcs = d.sources || [];
    var refused = srcs.length === 0;

    // 多轮：服务端回什么会话号就用什么，保持一个真相来源
    if (d.session_id) SID = d.session_id;

    var turn = el('div', 'turn');

    // 用户这一句：右侧气泡
    var qline = el('div', 'turn-q');
    qline.appendChild(el('div', 'bubble', q));
    turn.appendChild(qline);

    // 补全过才显示：这句话单独看没意义，是上文把它补成这样的
    if (d.condensed && d.resolved_question) {
      var rl = el('div', 'turn-resolved');
      rl.appendChild(el('span', null, '结合上文理解为'));
      rl.appendChild(el('b', null, d.resolved_question));
      turn.appendChild(rl);
    }

    // 一行小字装下所有状态：徽章做重了就不像产品了
    var bar = el('div', 'cbar');
    if (refused) {
      bar.appendChild(el('span', 'tag', '资料不足'));
    } else if (d.fallback_used) {
      var fbt = el('span', 'tag fb', '生成层兜底');
      fbt.title = '精排拒答后，弱相关资料被交给生成层终审，它判断能答';
      bar.appendChild(fbt);
    } else {
      bar.appendChild(el('span', 'tag ok', '精排命中'));
    }
    bar.appendChild(el('span', 'tag mode', d.mode || 'rerank'));
    if (d.history_turns) bar.appendChild(el('span', 'tag', '第 ' + (d.history_turns + 1) + ' 轮'));

    // 缓存命中：这次没有重新检索，答案和第一次完全一样。
    // 不说清楚的话，用户会以为「秒回」是因为问得简单。
    if (d.cached) {
      var cb = el('span', 'tag hint', '命中缓存');
      cb.title = '这条问题之前答过，直接复用了上次的结果（tokens 记 0）';
      bar.appendChild(cb);
    }
    // 贴线提醒：这次判定离门线不到 0.006，同一句话重跑有可能翻面。
    // 只做提示，不改结论 —— 改判定的地方只有后端的 pick_hits 一处。
    if (d.uncertain) {
      var u = el('span', 'tag hint', '判定贴线');
      u.title = '这次判定离门线不到 UNCERTAIN_BAND（默认 0.006），同一句话重跑可能给出相反结论';
      bar.appendChild(u);
    }

    var meta = [];
    meta.push((ms / 1000).toFixed(2) + 's');
    // 补全那一段单独报出来：不然「多轮怎么慢了一秒」只能靠猜
    if (d.timings && d.timings.condense_ms) {
      meta.push('补全 ' + (d.timings.condense_ms / 1000).toFixed(2) + 's');
    }
    // 拆解也单独报：multi 模式慢的那一秒大概率花在这里，
    // 混进总耗时里会让人以为「检索变慢了」。
    if (d.timings && d.timings.decomp_ms) {
      meta.push('拆解 ' + (d.timings.decomp_ms / 1000).toFixed(2) + 's');
    }
    if (!refused) meta.push(srcs.length + ' 段');
    if (d.tokens) meta.push(d.tokens + ' tok');
    var mt = el('span', 'metrics', meta.join(' · '));
    bar.appendChild(mt);
    turn.appendChild(bar);

    var ans = el('div', refused ? 'answer refused' : 'answer');
    renderAnswer(ans, d.answer || '（空）');
    turn.appendChild(ans);

    // 拆成哪几路：拒答时也要显示。负例被拆成两路却仍然拒答，这件事本身
    // 就说明了「拆解不会把拒答打开」—— 藏起来反而像它没生效。
    if (d.sub_questions && d.sub_questions.length) {
      var subs = el('div', 'subs');
      subs.appendChild(el('span', 'subs-label', '拆成 ' + d.sub_questions.length + ' 路'));
      d.sub_questions.forEach(function (s) {
        subs.appendChild(el('span', 'sub-chip', s));
      });
      turn.appendChild(subs);
    }
    if (refused) turn.appendChild(whyBox(d));
    if (!refused) turn.appendChild(srcList(srcs));

    out.appendChild(turn);
    // 新一轮进来时滚到底部：多轮里最该看见的永远是最新那条
    requestAnimationFrame(scrollBottom);
  }

  function fail(msg, q) {
    // 之前这里是 out.innerHTML=''，单轮时代没问题；多轮里那等于
    // 「问错一句就把前面聊过的全擦了」。现在只追加一条错误。
    var turn = el('div', 'turn');
    if (q) {
      var qline = el('div', 'turn-q');
      qline.appendChild(el('div', 'bubble', q));
      turn.appendChild(qline);
    }
    var box = el('div', 'err');
    box.appendChild(el('b', null, '请求失败'));
    box.appendChild(document.createTextNode(msg));
    turn.appendChild(box);
    out.appendChild(turn);
    requestAnimationFrame(scrollBottom);
  }

  /* ---- 提问 ---- */
  function ask(q) {
    q = (q || '').trim();
    if (!q || busy) return;
    busy = true;
    btn.disabled = true;

    if (!SID) SID = newSid();

    // 空状态只擦一次，之后的每一轮都往后追加
    var empty = out.querySelector('.empty');
    if (empty) out.innerHTML = '';

    var ld = el('div', 'turn');
    var lw = el('div', 'loading');
    var dots = el('span', 'dots');
    dots.appendChild(el('i')); dots.appendChild(el('i')); dots.appendChild(el('i'));
    lw.appendChild(dots);
    lw.appendChild(el('span', null, '检索中：向量召回 → 精排 → 生成'));
    ld.appendChild(lw);
    out.appendChild(ld);
    requestAnimationFrame(scrollBottom);

    var body0 = null;
    var mode = $('#mode').value;
    var fb = $('#fb').checked ? '1' : '0';
    var t0 = performance.now();

    // 必须 return：?q= 连续问下去靠的就是这个 promise 串行
    return fetch('/rag?mode=' + encodeURIComponent(mode) + '&fallback=' + fb, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ question: q, session_id: SID })
    }).then(function (r) {
      var ms = performance.now() - t0;
      return r.json().then(function (body) {
        if (ld.parentNode) ld.parentNode.removeChild(ld);
        body0 = body;
        if (r.ok) { render(q, body, ms); return; }

        var detail = body && body.detail;
        if (typeof detail !== 'string') detail = JSON.stringify(detail || body);

        // 401 和 429 是「能自己解决」的两类，不该跟 500 一样丢一坨红字：
        // 401 直接把口令框调出来，429 告诉用户等几秒，别让人以为服务坏了。
        if (r.status === 401) {
          code = '';
          localStorage.removeItem(CODE_KEY);
          showCode('口令不对，重新输一次');
          throw new Error('需要访问口令。拿到口令后填在下面的输入框里。');
        }
        if (r.status === 429) {
          var wait = r.headers.get('Retry-After');
          throw new Error(detail + (wait ? '（约 ' + wait + ' 秒）' : ''));
        }
        throw new Error('HTTP ' + r.status + '\n' + detail);
      });
    }).catch(function (e) {
      if (ld.parentNode) ld.parentNode.removeChild(ld);
      fail(e.message || String(e), q);
    }).then(function () {
      busy = false;
      btn.disabled = false;
      return body0;                    // 交回这一轮的返回体，方便串行复现整段对话
    });
  }

  $('#newchat').onclick = function () {
    if (SID) {                       // 服务端那份也删掉，不留半个会话在那儿
      fetch('/session/' + encodeURIComponent(SID), {
        method: 'DELETE', headers: authHeaders()
      }).catch(function () {});
    }
    SID = null;
    out.innerHTML =
      '<div class="empty">' +
        '<div class="hero-logo">健</div>' +
        '<h1>新对话</h1>' +
        '<p class="sub">上一段已经清掉了，这一句不会带上任何上文。</p>' +
      '</div>';
    ta.value = '';
    ta.focus();
    requestAnimationFrame(scrollBottom);
  };

  btn.onclick = function () { ask(ta.value); };
  ta.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      ask(ta.value);
    }
  });
  // 输入框跟着内容长高，省得长问题挤成两行看不全
  ta.addEventListener('input', function () {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 160) + 'px';
  });

  /* 支持 ?q=问题 直接提问，方便把「这个问题在这套系统里的表现」作为链接发给别人。
     支持重复多个 ?q=：按顺序问下去，问的就是**同一段多轮对话** ——
     想跟人说明「追问到底有没有用」，发一条链接比截图强。
     ?mode=multi 让链接直接落在拆解模式上：不然「对比两种模式」得让对方
     自己去下拉框里找，十次有八次找错。 */
  (function pickMode() {
    var want = new URLSearchParams(location.search).get('mode');
    if (!want) return;
    var sel = $('#mode');
    for (var i = 0; i < sel.options.length; i++) {
      if (sel.options[i].value === want) { sel.value = want; return; }
    }
  })();

  var presets = new URLSearchParams(location.search).getAll('q');
  (function runPreset(i) {
    if (i >= presets.length) return;
    ta.value = presets[i];
    ask(presets[i]).then(function () { runPreset(i + 1); });
  })(0);
})();
</script>
</body>
</html>
